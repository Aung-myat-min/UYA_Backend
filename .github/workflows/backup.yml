name: Weekly PostgreSQL Backup

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create backup directory
        run: mkdir -p db_backups

      - name: Dump PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" -F c -f db_backups/uya_backup_$(date +%Y-%m-%d).dump

      - name: Commit backup
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add db_backups/
          git commit -m "Weekly backup on $(date +%Y-%m-%d)" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/htetarkar2246/UYA_Backend.git
          git push origin main
