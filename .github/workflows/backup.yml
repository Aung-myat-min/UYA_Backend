name: Weekly PostgreSQL Backup

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create backup directory
        run: mkdir -p db_backups

      - name: Dump PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" -F c -f db_backups/uya_backup_$(date +%Y-%m-%d).dump

      - name: Commit backup
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add db_backups/
          git commit -m "Weekly backup on $(date +%Y-%m-%d)" || echo "No changes to commit"

      - name: Push backup to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git push
