name: Daily PostgreSQL Backup

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    # Add necessary permissions to write to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Add PostgreSQL PPA and install the correct client version
      - name: Install PostgreSQL client version 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create backup directory
        run: mkdir -p db_backups

      - name: Dump PostgreSQL database
        # Explicitly call pg_dump from the version 17 binary path
        run: /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -F c -f db_backups/uya_backup_$(date +%Y-%m-%d).dump
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        # Use a better way to handle the commit and push
        run: |
          git add db_backups/
          git commit -m "Daily backup on $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
